[package]
name = "wb-cli"
description = "wb.exe thin CLI client: full command surface with --json contract."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wb"
path = "src/main.rs"

[dependencies]
wb-core = { path = "../wb-core" }
wb-plugin-sdk = { path = "../wb-plugin-sdk" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
interprocess = "2"
