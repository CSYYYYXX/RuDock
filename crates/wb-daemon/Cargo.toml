[package]
name = "wb-daemon"
description = "WB resident daemon: JSON-RPC server over named pipe, plugin pool, permissions/audit."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wb-daemon"
path = "src/main.rs"

[dependencies]
wb-core = { path = "../wb-core" }
wb-plugin-sdk = { path = "../wb-plugin-sdk" }
wb-plugin-host = { path = "../wb-plugin-host" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
interprocess = "2"
sha2 = { workspace = true }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
] }
