<!doctype html>
<html><head><meta charset="utf-8"><title>wb webmessage selftest</title></head>
<body style="background:transparent">
<script>
// WebMessage channel self-test:
// 1. page → host: {"kind":"query","id":1,"text":"a"}
// 2. host queries daemon over named pipe, posts results back
// 3. page → host: {"kind":"selftest", ok, detail}  (host prints to stdout)
(function () {
  const bridge = window.chrome && window.chrome.webview;
  function report(ok, detail) {
    if (bridge) bridge.postMessage({ kind: 'selftest', ok: ok, detail: detail });
    document.title = 'SELFTEST ' + (ok ? 'PASS' : 'FAIL');
  }
  if (!bridge) { document.title = 'SELFTEST NOBRIDGE'; return; }
  let done = false;
  const timer = setTimeout(() => { if (!done) { done = true; report(false, 'timeout waiting results'); } }, 6000);
  bridge.addEventListener('message', ev => {
    const m = ev.data;
    if (m && m.kind === 'results' && m.id === 1 && !done) {
      done = true; clearTimeout(timer);
      const n = (m.results || []).length;
      report(true, 'results=' + n + (m.error ? ' err=' + m.error : ''));
    }
  });
  bridge.postMessage({ kind: 'query', id: 1, text: 'a' });
})();
</script>
</body></html>
