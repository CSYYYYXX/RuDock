<div class="wrap">
  <div class="big"><b id="n">–</b><span>条历史</span></div>
  <div class="latest" id="latest">读取中…</div>
  <button id="btn">刷 新</button>
</div>
<style>
  html, body { background: transparent !important; color-scheme: dark; }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 10px 16px 14px; gap: 8px; }
  .big b { font-size: 30px; font-weight: 200; font-variant-numeric: tabular-nums; }
  .big span { color: #9aa4b8; font-size: 12px; margin-left: 6px; }
  .latest { flex: 1; color: #9aa4b8; font-size: 12px; line-height: 1.5; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
  button { align-self: flex-start; background: rgba(255,255,255,.08); color: #eaf0ff;
    border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 4px 14px;
    font-size: 12px; cursor: pointer; transition: background .15s; }
  button:hover { background: rgba(255,255,255,.16); }
  @container (max-width: 180px) {
    .wrap { padding: 7px 9px 9px; gap: 5px; }
    .big b { font-size: 24px; }
    button { padding-inline: 9px; }
  }
  @container (max-height: 100px) {
    .wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; padding: 5px 8px; }
    .latest { -webkit-line-clamp: 1; }
    button { align-self: center; }
  }
  @media (prefers-color-scheme: light) {
    html, body { color-scheme: light; }
    .big { color: #17202b; }
    .big span, .latest { color: #526273; }
    button { color: #17202b; background: rgba(21,32,43,.07); border-color: rgba(21,32,43,.14); }
    button:hover { background: rgba(21,32,43,.12); }
  }
</style>
<script>
  var TEXT = {
    'zh-CN': { count:'条历史', loading:'读取中…', empty:'（空）', latest:'最近：', refresh:'刷新' },
    en: { count:'items', loading:'Loading…', empty:'(empty)', latest:'Latest: ', refresh:'Refresh' },
    ja: { count:'件の履歴', loading:'読み込み中…', empty:'（空）', latest:'最近：', refresh:'更新' },
    ko: { count:'개 기록', loading:'불러오는 중…', empty:'(비어 있음)', latest:'최근: ', refresh:'새로고침' }
  };
  function localize() {
    var w = TEXT[document.documentElement.lang] || TEXT.en;
    document.querySelector('.big span').textContent = w.count;
    document.getElementById('btn').textContent = w.refresh;
    return w;
  }
  function load() {
    var w = localize();
    document.getElementById('latest').textContent = w.loading;
    wbRpc('clip.get', { last: 8 }).then(function (d) {
      var arr = (d && d.result) || [];
      document.getElementById('n').textContent = arr.length;
      var latest = (arr[0] && arr[0].content) ? String(arr[0].content) : w.empty;
      document.getElementById('latest').textContent = w.latest + latest.slice(0, 120);
    });
  }
  document.getElementById('btn').addEventListener('click', load);
  window.addEventListener('wbresize', localize);
  load();
</script>
