name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0-x86_64-pc-windows-gnu

      - name: Configure MinGW
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          if (-not (Test-Path "$mingw\gcc.exe")) {
            throw "MinGW is unavailable at $mingw"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build portable release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            .\scripts\build-release.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
          } else {
            .\scripts\build-release.ps1
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuDock-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
